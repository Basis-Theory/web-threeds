<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Basis Theory 3DS Method Request</title>
  </head>

  <body>
    <h1>Collecting Browser Data...</h1>
    <p>
      If you are not redirected automatically, please click
      <a href="#" onclick="document.threeDSMethodForm.submit(); return false;"
        >here</a
      >.
    </p>
  </body>

  <script>
    let methodFrame;
    let sessionId;
    let notificationOrigin;
    let parentOrigin;

    window.addEventListener('message', (event) => {
      if (event.data?.type === 'startMethod') {
        if (event.source !== window.parent || methodFrame) return;

        const { threeDSMethodURL, threeDSMethodData } = event.data;
        parentOrigin = event.origin;

        try {
          if (!threeDSMethodURL || !threeDSMethodData) throw new Error();
          const data = JSON.parse(
            atob(threeDSMethodData.replace(/-/g, '+').replace(/_/g, '/'))
          );
          if (
            typeof data.threeDSServerTransID !== 'string' ||
            !data.threeDSServerTransID ||
            typeof data.threeDSMethodNotificationURL !== 'string'
          ) {
            throw new Error();
          }
          sessionId = data.threeDSServerTransID;
          notificationOrigin = new URL(data.threeDSMethodNotificationURL)
            .origin;
        } catch {
          window.parent?.postMessage(
            {
              type: 'error',
              details: 'Invalid 3DS Method request data',
            },
            parentOrigin
          );
          return;
        }

        const iframe = document.createElement('iframe');
        methodFrame = iframe;
        iframe.name = 'acsMethodIframe';
        iframe.id = 'acsSMethodIframe';
        iframe.style.display = 'none';
        iframe.width = '0';
        iframe.height = '0';
        iframe.frameBorder = '0';
        iframe.style.border = '0';
        document.body.appendChild(iframe);

        const form = document.createElement('form');
        form.name = 'threeDSMethodForm';
        form.action = threeDSMethodURL;
        form.method = 'POST';
        form.target = iframe.name;

        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'threeDSMethodData';
        input.value = threeDSMethodData;
        form.appendChild(input);
        document.body.appendChild(form);

        form.submit();
      } else if (
        methodFrame &&
        event.source === methodFrame.contentWindow &&
        event.origin === notificationOrigin &&
        event.data?.type === 'method' &&
        event.data.id === sessionId &&
        typeof event.data.isCompleted === 'boolean'
      ) {
        window.parent?.postMessage(event.data, parentOrigin);
      }
    });
  </script>
</html>
