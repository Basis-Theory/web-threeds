name: Deploy Bundle to Dev

on:
  push:
    branches: [master]

jobs:
  terraform-dev:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: DEV
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::914054469264:role/web-threeds-gh-admin
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config=dev.tfbackend
        working-directory: terraform/
        env:
          TF_VAR_env: dev
          TF_VAR_r2_access_key: ${{ secrets.R2_ACCESS_KEY }}
          TF_VAR_r2_secret_key: ${{ secrets.R2_SECRET_KEY }}

      - name: Terraform Apply Dev
        run: terraform apply -auto-approve
        working-directory: terraform/
        env:
          TF_VAR_env: dev
          TF_VAR_r2_access_key: ${{ secrets.R2_ACCESS_KEY }}
          TF_VAR_r2_secret_key: ${{ secrets.R2_SECRET_KEY }}

  build-release:
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
      actions: read
    environment: DEV
    strategy:
      matrix:
        node: ["20.x"]
        os: [ubuntu-latest]
    env:
      CI: 1
      HUSKY: 0 # disables husky hooks
    needs:
      - terraform-dev
    steps:
      - name: Checkout Repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: AnimMouse/setup-rclone@26ef2133e09fd383329a1d4c1fbe6a71db1976c9 # v1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@5fd3084fc36e372ff1fff382a39b10d03659f355 # v2
        with:
          role-to-assume: arn:aws:iam::914054469264:role/web-threeds-gh-admin
          aws-region: us-east-2

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          # registry-url not needed - no npm publishing in dev workflow

      - name: Install Deps (with cache)
        uses: bahmutov/npm-install@20216767ca67f0f7b4d095dc5859c5700a6581cb # v1
        with:
          install-command: yarn --immutable --no-progress --ignore-scripts

      - name: Get New Version
        id: get-new-version
        uses: mathieudutour/github-tag-action@a2505118dd9b4797d9f8d45747f562db67e2aa6c # v5.2
        with:
          dry_run: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Version
        run: make update-version NEW_VERSION=${{ steps.get-new-version.outputs.new_version }}

      - name: Build
        run: make build
        env:
          SKIP_INSTALL: 1 # install with cache was done already

      - name: Deploy CDN Bundle to Dev
        run: make upload-bundle
        env:
          BLOB: true
          CLOUDFLARE: true
          ENVIRONMENT: dev # Used by uploadbundle.sh for R2 bucket naming (dev-3ds)
          R2_ACCESS_KEY: ${{secrets.R2_ACCESS_KEY}}
          R2_SECRET_KEY: ${{secrets.R2_SECRET_KEY}}

  create-pre-release:
    runs-on: ubuntu-latest
    environment: TAG
    needs:
      - build-release
      - terraform-dev
    strategy:
      matrix:
        node: ["20.x"]
    steps:
      - name: Mint tag-app token
        id: tag-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_TAG_APP_ID }}
          private-key: ${{ secrets.GH_APP_TAG_KEY }}

      - name: Version and Tag
        id: version-and-tag
        uses: mathieudutour/github-tag-action@a2505118dd9b4797d9f8d45747f562db67e2aa6c # v5.2
        with:
          github_token: ${{ steps.tag-token.outputs.token }}

      - name: Generate Release Notes
        id: release-notes
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        env:
          NEW_RELEASE_TAG: ${{ steps.version-and-tag.outputs.new_tag }}
        with:
          result-encoding: string
          script: |
            const { NEW_RELEASE_TAG } = process.env;
            const latestRelease = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const releaseNotes = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: NEW_RELEASE_TAG,
              previous_tag_name: latestRelease.data.tag_name,
            });
            return releaseNotes.data.body;

      - name: Create Pre-Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          generate_release_notes: false
          body: ${{ steps.release-notes.outputs.result }}
          tag_name: ${{ steps.version-and-tag.outputs.new_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop Deploy Message
        if: always()
        uses: Basis-Theory/public-github-actions/deploy-slack-action@12362db6b1ad6b524d28c47a6489c3e73ecd656a # master
        with:
          slack-api-token: ${{ secrets.SLACK_DUCKBOT_API_KEY }}
          channel: ${{ vars.SLACK_DUCKBOT_DEV_DEPLOY_CHANNEL_ID }}
          status: "done"
